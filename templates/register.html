{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-slate-800/90 border border-slate-700/80 p-8 rounded-2xl shadow-2xl backdrop-blur-md">
    
    <div class="text-center">
      <div class="mx-auto w-14 h-14 bg-gradient-to-tr from-sky-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-sky-500/20 mb-4">
        <i class="fa-solid fa-user-plus text-white text-2xl"></i>
      </div>
      <h2 class="text-2xl font-bold tracking-tight text-white">Create Vault Account</h2>
      <p class="mt-2 text-xs text-slate-400">
        Register an account to securely encrypt and store your private data and files.
      </p>
    </div>

    <form class="mt-8 space-y-5" action="{{ url_for('register') }}" method="POST">
      <div>
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Username</label>
        <div class="relative rounded-lg shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-user text-sm"></i>
          </div>
          <input id="username" name="username" type="text" required autofocus
                 class="block w-full pl-10 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent text-sm"
                 placeholder="Choose a username">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Password</label>
        <div class="relative rounded-lg shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-lock text-sm"></i>
          </div>
          <input id="password" name="password" type="password" required minlength="6"
                 class="block w-full pl-10 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent text-sm"
                 placeholder="Minimum 6 characters">
        </div>
      </div>

      <div>
        <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Confirm Password</label>
        <div class="relative rounded-lg shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-check-double text-sm"></i>
          </div>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="6"
                 class="block w-full pl-10 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent text-sm"
                 placeholder="Re-enter password">
        </div>
      </div>

      <div>
        <button type="submit"
                class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-lg shadow-sky-500/20 text-sm font-semibold text-white bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition-all">
          <i class="fa-solid fa-user-check mr-2"></i> Register Account
        </button>
      </div>
    </form>

    <div class="pt-4 border-t border-slate-700/80 text-center text-xs text-slate-400">
      Already have an account?
      <a href="{{ url_for('login') }}" class="font-medium text-sky-400 hover:text-sky-300 ml-1 underline underline-offset-4">Log in here</a>
    </div>

  </div>
</div>
{% endblock %}
